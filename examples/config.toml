# ~/.config/lightweight-harness/config.toml에 복사하거나 lightweight-harness --config /path/to/config.toml로 지정한다.
# providers 아래의 프로필 키를 --provider 또는 /use로 선택한다.
# CLI·환경변수에서 제공자를 선택하지 않았을 때 사용할 기본 프로필이다.
default_provider = "openrouter"

[plugins]
# 같은 Python 환경에 설치된 module:setup 진입점을 지정한다. 빈 목록은 기본 코어만 사용한다.
enabled = []

[providers.openrouter]
# name은 UI 표시용 이름이고, base_url에는 /chat/completions를 뺀 API 루트를 넣는다.
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
# 키를 파일에 저장하지 않고 이 이름의 환경변수에서 요청 시 읽는다.
api_key_env = "OPENROUTER_API_KEY"
# 제공자가 인식하는 모델 ID를 지정한다. CLI·환경변수에서 이번 실행의 모델을 바꿀 수 있다.
model = "openai/gpt-5"

# api_format을 생략하면 OpenAI 호환 Chat Completions 형식을 사용한다.
[providers.openai]
name = "OpenAI"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-5"

# Anthropic Messages 예제: 사용할 줄의 주석을 해제하고 계정에서 지원하는 모델 ID로 바꾼다.
# max_tokens는 한 응답의 출력 토큰 상한이며 대화 압축 기능은 아니다.
# [providers.anthropic]
# name = "Anthropic"
# api_format = "anthropic"
# base_url = "https://api.anthropic.com/v1"
# api_key_env = "ANTHROPIC_API_KEY"
# model = "your-claude-model"
# max_tokens = 4096

# 사용자 정의 OpenAI 호환 제공자 예제: 주소·환경변수 이름·모델 ID를 서버에 맞춘다.
# [providers.my-local-or-cloud-provider]
# name = "My Provider"
# base_url = "https://example.com/v1"
# api_key_env = "MY_PROVIDER_API_KEY"
# model = "my-model"

# 인증이 없는 로컬 서버 예제: api_key_env를 빈 문자열로 명시해야 인증 헤더를 생략한다.
# [providers.local]
# name = "Local"
# base_url = "http://localhost:1234/v1"
# api_key_env = ""
# model = "your-local-model"
