# 빌드 도구는 설치 시 별도 환경에서 준비한다. 런타임 의존성에는 포함하지 않는다.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# 배포 이름과 버전이다. 패키지 내부의 __version__과 버전을 함께 관리한다.
name = "lightweight-harness"
version = "0.2.0"
description = "A lightweight, model-driven coding harness"
readme = "README.md"
# 지원·검증하는 Python 하한을 선언해 설치 도구가 호환되는 인터프리터를 선택하게 한다.
requires-python = ">=3.12"
# httpx는 API 통신, Textual은 터미널 UI에 사용한다. 1.0 이상으로 자동 갱신되는 것을 막는다.
dependencies = [
  "httpx>=0.27,<1",
  "textual>=0.89,<1",
]

[project.optional-dependencies]
# 일반 사용자 설치에 테스트 도구를 포함하지 않고 개발 환경에서만 선택한다.
dev = ["pytest>=8,<9"]

[project.scripts]
# 설치 도구가 lightweight-harness 실행 명령을 생성하고 공통 main 함수로 연결하게 한다.
lightweight-harness = "lightweight_harness.app:main"

[tool.hatch.build.targets.wheel]
# 실행 패키지만 wheel에 포함해 테스트·문서·예제를 런타임 코드와 분리한다.
packages = ["lightweight_harness"]
